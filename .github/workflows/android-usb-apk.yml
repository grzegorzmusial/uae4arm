name: Build USB joystick test APK
on:
  push:
    branches: [fix/usb-button4-as-touch3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git unzip python3 build-essential
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;25.2.9519653" "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Prepare pinned Android SDL and IPF library
        run: |
          git clone --no-checkout https://github.com/pelya/commandergenius androidsdl
          git -C androidsdl checkout e0d402e50
          mkdir -p androidsdl/project/jni/application/uae4arm
          cp -a source/. androidsdl/project/jni/application/uae4arm/
          git clone https://github.com/FrodeSolheim/capsimg androidsdl/project/jni/capsimage
          git -C androidsdl/project/jni/capsimage checkout ed4cb09
          rm androidsdl/project/jni/capsimage/CAPSImg/dllmain.cpp
          cp source/capsimage/Android.mk androidsdl/project/jni/capsimage/
          cp source/capsimage/config.h androidsdl/project/jni/capsimage/CAPSImg/
          git -C androidsdl apply --check project/jni/application/uae4arm/androidsdl.patch
          git -C androidsdl apply project/jni/application/uae4arm/androidsdl.patch
          git -C androidsdl apply project/jni/application/uae4arm/usb-gamepads.patch
      - name: Check independent buttons and directions
        run: python3 source/tests/test_usb_gamepads.py androidsdl/project/jni/sdl-1.2/src/video/android/SDL_androidinput.c
      - name: Create test signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -validity 10000 -dname "CN=UAE4ARM USB Fix Test"
      - name: Build and verify APK
        working-directory: androidsdl
        env:
          NCPU: '4'
        run: |
          ./build.sh release uae4arm
          apksigner verify --verbose project/app/build/outputs/apk/release/app-release.apk
          mkdir -p "$GITHUB_WORKSPACE/deliverables"
          cp project/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/deliverables/Uae4arm-USB-Fix.apk"
          cd "$GITHUB_WORKSPACE/deliverables"
          sha256sum Uae4arm-USB-Fix.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Uae4arm-USB-Fix
          path: deliverables/
          if-no-files-found: error
